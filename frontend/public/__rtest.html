<!doctype html>
<html><head><meta charset="utf-8"><title>Responsive audit</title>
<style>body{margin:0;font:12px system-ui}iframe{border:0;display:block;background:#fff}#stage{position:absolute;left:0;top:0}pre{white-space:pre-wrap}</style></head>
<body><pre id="result">running</pre><div id="stage"></div>
<script>
// Temporary responsive audit. ?auth=0 runs signed out. ?shot=/path&w=375&h=900 renders one frame for a screenshot.
const q = new URLSearchParams(location.search)
const token = q.get('token')
if (q.get('auth') === '0') { localStorage.removeItem('event_token'); localStorage.removeItem('event_user') }
else if (token) {
  localStorage.setItem('event_token', token)
  localStorage.setItem('event_user', q.get('user'))
}
localStorage.setItem('event_last_active', String(Date.now()))
setInterval(() => localStorage.setItem('event_last_active', String(Date.now())), 10000) // a long audit must not trip the idle sign-out

const label = (el) => {
  let s = el.tagName.toLowerCase()
  if (el.id) s += `#${el.id}`
  const cls = [...el.classList].slice(0, 3)
  if (cls.length) s += `.${cls.join('.')}`
  const text = (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 30)
  return text ? `${s} "${text}"` : s
}
const measure = (win) => {
  const doc = win.document
  const vw = doc.documentElement.clientWidth
  const found = new Set()
  const offenders = []
  for (const el of doc.body.querySelectorAll('*')) {
    const r = el.getBoundingClientRect()
    if (r.width < 1 || r.height < 1) continue
    if (r.right <= vw + 1 && r.left >= -1) continue
    const cs = win.getComputedStyle(el)
    if (cs.visibility === 'hidden' || cs.display === 'none' || Number(cs.opacity) === 0) continue
    if (cs.position === 'fixed' && (r.right <= 0 || r.left >= vw)) { found.add(el); continue } // closed off-canvas menu: skip it and its contents
    let clipped = false
    for (let p = el.parentElement; p && p !== doc.body && p !== doc.documentElement; p = p.parentElement) {
      if (found.has(p)) { clipped = true; break } // report only the outermost offender
      const ps = win.getComputedStyle(p)
      if (ps.overflowX === 'visible') continue
      const pr = p.getBoundingClientRect()
      if (pr.right > vw + 1 || pr.left < -1) continue
      // A scroll box keeps content reachable; a small clip (rounded card, ellipsis) is deliberate.
      // A page-wide overflow:hidden only hides the overflow, so it does not count as contained.
      if (ps.overflowX === 'auto' || ps.overflowX === 'scroll' || pr.width < vw * 0.9) { clipped = true; break }
    }
    if (clipped) continue
    found.add(el)
    if (offenders.length >= 8) continue
    offenders.push(`${label(el)} [${Math.round(r.left)}..${Math.round(r.right)}${cs.position === 'fixed' ? ' fixed' : ''}]`)
  }
  return { vw, pageScroll: doc.documentElement.scrollWidth - vw, bodyScroll: doc.body.scrollWidth - vw, offenders: offenders.slice(0, 8) }
}
const load = (path, w, h = 900) => new Promise((resolve) => {
  const frame = document.createElement('iframe')
  frame.style.width = `${w}px`; frame.style.height = `${h}px`
  frame.src = path
  document.getElementById('stage').appendChild(frame)
  frame.onload = () => setTimeout(() => resolve(frame), Number(q.get('wait') || 3500))
})

;(async () => {
  if (q.get('shot')) {
    const frame = await load(q.get('shot'), Number(q.get('w')), Number(q.get('h') || 900))
    if (q.get('scroll')) frame.contentWindow.scrollTo(0, Number(q.get('scroll')))
    document.getElementById('result').remove()
    return
  }
  const routes = (q.get('routes') || '').split(',').filter(Boolean)
  const widths = (q.get('widths') || '320,375,414,480,600,768,900,1024,1280,1440,1920').split(',').map(Number)
  const report = {}
  for (const path of routes) {
    const frames = await Promise.all(widths.map((w) => load(path, w)))
    report[path] = {}
    frames.forEach((frame, i) => {
      const m = measure(frame.contentWindow)
      const where = frame.contentWindow.location.pathname
      if (m.pageScroll > 0 || m.offenders.length || where !== path.split('?')[0]) report[path][widths[i]] = { ...m, ...(where !== path.split('?')[0] ? { landedOn: where } : {}) }
      frame.remove()
    })
    if (!Object.keys(report[path]).length) report[path] = 'OK at all widths'
  }
  document.getElementById('result').textContent = JSON.stringify(report, null, 1)
})().catch((e) => { document.getElementById('result').textContent = 'ERROR ' + (e.stack || e) })
</script></body></html>
